<div class="container" style="margin-top: 10%;">
  <div class="columns is-centered">
    <div class="box column is-one-third">
      <h1 class="title has-text-centered">Typing Game</h1>
      <p class="has-text-centered" style="margin-bottom: 20px;"><span 
        *ngFor="let letter of randomText.split(''); let i = index;"
        [ngClass]="letter==enteredText[i]?'success':(!enteredText[i]?'pending':'fail')"
        >{{letter}}</span></p>
      <div class="field">
        <input class="input" (input)='onInput($any($event.target).value)'>
      </div>

      <div class="box" *ngIf="isMatched">
        <div class="title has-text-centered success">Success!</div>
        <div class="button has-text-centered" style="margin-left: 25%;" (click)="onClickReload()">Go for Another One!</div>
      </div>
    <div class="is-size-7 has-text-centered" >Made By Dwaipayan Bhattacharya</div>   
  </div>
  
</div>
